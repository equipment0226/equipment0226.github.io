<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dae-Seong Ray Yang | IMMS 14</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
    color: #e8ecff;
    background: radial-gradient(ellipse at 20% 20%, #1b1f4b 0%, #0a0c24 45%, #03040d 100%);
  }
  .nebula {
    position: fixed; inset: -20%;
    background:
      radial-gradient(circle at 30% 40%, rgba(120, 80, 255, .18), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(0, 190, 255, .14), transparent 40%),
      radial-gradient(circle at 55% 25%, rgba(255, 90, 180, .10), transparent 35%);
    animation: drift 40s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate(-3%, -2%) scale(1); }
    to   { transform: translate(3%, 2%) scale(1.1); }
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  main {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 24px;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 700; letter-spacing: .02em;
    background: linear-gradient(90deg, #9ad1ff, #c9a7ff, #ffb3e6, #9ad1ff);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    animation: shine 8s linear infinite, float 6s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(150, 150, 255, .45));
  }
  .badge {
    margin-top: 14px;
    padding: 6px 20px;
    border: 1px solid rgba(160, 190, 255, .45);
    border-radius: 999px;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    letter-spacing: .25em;
    color: #cfe0ff;
    background: rgba(100, 120, 255, .08);
    box-shadow: 0 0 20px rgba(110, 140, 255, .25);
    animation: float 6s ease-in-out infinite .5s;
  }
  .theme {
    margin-top: 48px;
    font-size: clamp(1.1rem, 2.8vw, 1.8rem);
    line-height: 1.8;
    color: #d8defa;
    text-shadow: 0 0 14px rgba(140, 160, 255, .5);
    opacity: 0;
    animation: fadeUp 1.6s ease-out .6s forwards;
  }
  .theme span {
    display: block;
    color: #fff;
    font-weight: 600;
    animation: glow 3.5s ease-in-out infinite;
  }
  .repo {
    margin-top: 40px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 26px;
    border: 1px solid rgba(160, 190, 255, .5);
    border-radius: 999px;
    color: #e8ecff; text-decoration: none;
    background: rgba(100, 120, 255, .1);
    box-shadow: 0 0 18px rgba(110, 140, 255, .3);
    transition: transform .25s, box-shadow .25s, background .25s;
    opacity: 0;
    animation: fadeUp 1.6s ease-out 1.2s forwards;
  }
  .repo:hover {
    transform: translateY(-3px);
    background: rgba(130, 140, 255, .25);
    box-shadow: 0 0 30px rgba(160, 150, 255, .7);
  }
  .repo svg { width: 20px; height: 20px; fill: currentColor; }
  @keyframes shine { to { background-position: 300% 0; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes glow {
    0%,100% { text-shadow: 0 0 10px rgba(160, 180, 255, .4); }
    50% { text-shadow: 0 0 24px rgba(190, 160, 255, .95); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .theme { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="nebula"></div>
  <canvas id="space"></canvas>

  <main>
    <h1>Dae-Seong Ray Yang</h1>
    <div class="badge">IMMS 14</div>
    <p class="theme">
      제조업과 장비를 위한 AI 기술,
      <span>엔지니어 업무, 삶의 질 향상을 위한 AX</span>
    </p>
    <a class="repo" href="https://github.com/equipment0226/equipment0226.github.io">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub Repository
    </a>
  </main>

<script>
  const canvas = document.getElementById("space");
  const ctx = canvas.getContext("2d");
  let w, h, stars = [], shooting = [];
  const mouse = { x: 0, y: 0 };

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.floor((w * h) / 4500);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.4 + .3,
      depth: Math.random() * .9 + .1,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 1.5 + .5,
      hue: 200 + Math.random() * 80
    }));
  }

  addEventListener("resize", resize);
  addEventListener("mousemove", e => {
    mouse.x = (e.clientX / w - .5) * 2;
    mouse.y = (e.clientY / h - .5) * 2;
  });

  function spawnShooting() {
    shooting.push({
      x: Math.random() * w * .8, y: Math.random() * h * .4,
      vx: 7 + Math.random() * 5, vy: 3 + Math.random() * 3,
      life: 1
    });
    setTimeout(spawnShooting, 2500 + Math.random() * 4500);
  }

  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.x += s.depth * .08;
      if (s.x > w + 2) s.x = -2;
      const px = s.x - mouse.x * s.depth * 14;
      const py = s.y - mouse.y * s.depth * 14;
      const a = .35 + .65 * Math.abs(Math.sin(t / 1000 * s.speed + s.phase));
      ctx.beginPath();
      ctx.fillStyle = `hsla(${s.hue}, 80%, 85%, ${a})`;
      ctx.shadowColor = `hsla(${s.hue}, 90%, 80%, ${a})`;
      ctx.shadowBlur = s.r * 5;
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    for (let i = shooting.length - 1; i >= 0; i--) {
      const m = shooting[i];
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
      g.addColorStop(0, `rgba(255,255,255,${m.life})`);
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12);
      ctx.stroke();
      m.x += m.vx; m.y += m.vy; m.life -= .015;
      if (m.life <= 0) shooting.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }

  resize();
  spawnShooting();
  requestAnimationFrame(frame);
</script>
</body>
</html>
